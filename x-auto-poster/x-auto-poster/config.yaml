# =====================================================================
# x-auto-poster 設定ファイル
# 機密情報(APIキー等)はここではなく .env / GitHub Secrets に入れてください。
# =====================================================================

# --- 投稿スケジュール(日本時間 JST, 24時間表記 "HH:MM") ---
# ここに追加・削除・変更すれば、コードを触らずに投稿回数や時間を調整できます。
posting_times_jst:
  - "07:25"
  - "11:55"
  - "19:55"

# --- コンテンツ設定 ---
content:
  genre: "副業(初心者向け)のノウハウ・気づき"
  min_chars: 110
  max_chars: 135
  # スパムや誇大広告と誤認されやすい表現の例。Geminiへのプロンプトで
  # 明示的に避けるよう指示します。運用しながら追加してください。
  avoid_phrases:
    - "絶対に稼げる"
    - "誰でも簡単に稼げる"
    - "今すぐ登録"
    - "限定〇名"
    - "元本保証"
    - "必ず儲かる"

# --- 自己分析(過去の投稿実績を次のコンテンツ生成に反映する) ---
# Buffer の Post Metrics API から過去の投稿とインプレッション等を取得し、
# 直近で反応が良かった投稿を「参考事例」としてGeminiに渡します。
self_analysis:
  lookback_days: 30
  top_n_reference_posts: 5
  # Buffer側のメトリクス反映は最大24時間ほど遅れることがあるため、
  # 直近すぎる投稿は参考データが揃っていない可能性がある点に注意。

# --- Gemini モデル設定 ---
# 重要: Geminiのモデル名・無料枠は数か月単位で更新されます。
# 実行前に必ず https://ai.google.dev/gemini-api/docs/models で
# 現行モデル名と無料枠の条件を確認し、必要ならここを書き換えてください。
# (この値は2026年8月時点の一般的な構成例です)
gemini:
  text_model: "gemini-2.5-flash"
  image_model: "gemini-2.5-flash-image"   # 通称 "Nano Banana"。無料枠あり(要確認)
  text_generation_config:
    temperature: 1.0
    max_output_tokens: 400

# --- 画像スタイル ---
image:
  style_prompt: >
    文字やロゴ、透かしを一切含めない、スタイリッシュな3Dミニマルイラスト。
    やわらかい影と光沢のあるパステル〜アクセントカラーの組み合わせ、
    シンプルな幾何形状中心の構図で、スマートフォンのタイムライン上で
    思わず指を止めたくなるような、洗練された印象にすること。
  aspect_ratio: "1:1"

# --- Cloudinary アップロード先フォルダ(整理用、任意) ---
cloudinary:
  folder: "x-auto-poster"
